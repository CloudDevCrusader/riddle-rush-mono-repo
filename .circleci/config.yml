version: 2.1

# CircleCI configuration for Riddle Rush Nuxt PWA monorepo
# Mirrors GitLab CI pipeline structure with CircleCI-specific optimizations
#
# Custom Docker Image:
# This configuration uses a custom Docker image with pre-installed tools (AWS CLI, Terraform, pnpm)
# to speed up build times. Build and push your own image using:
#   cd .circleci && ./build-docker-image.sh --push
# The image will be pushed to GitLab Container Registry.

# Custom image with pre-installed tools (Node.js 20.19.0, pnpm, AWS CLI, Terraform)
# See .circleci/Dockerfile for details
# TODO: Replace with your GitLab project path after building and pushing the image
x-custom-image: &custom-image registry.gitlab.com/djdiox/riddle-rush-nuxt-pwa/ci-build:latest

# Reusable commands
commands:
  setup-pnpm:
    description: 'Setup pnpm via corepack'
    steps:
      - run:
          name: 'Prepare pnpm with corepack'
          command: |
            # Setup user directories for corepack cache
            export COREPACK_HOME="$HOME/.corepack"
            export PNPM_HOME="$HOME/.local/share/pnpm"
            export PATH="$PNPM_HOME:$COREPACK_HOME/bin:$PATH"
            mkdir -p "$COREPACK_HOME" "$PNPM_HOME"

            # Get pnpm version from package.json
            PNPM_VERSION=$(grep -oE '"packageManager"\s*:\s*"pnpm@[^"]*"' package.json | grep -oE 'pnpm@[^"]*' | cut -d'@' -f2 || echo "10.27.0")
            echo "Using pnpm version: ${PNPM_VERSION}"

            # Prepare pnpm (downloads to user cache, no system-wide installation)
            corepack prepare "pnpm@${PNPM_VERSION}" --activate

            # Create pnpm wrapper that always uses corepack (avoids permission issues)
            echo 'pnpm() { corepack pnpm "$@"; }' >> "$BASH_ENV"
            echo 'export -f pnpm 2>/dev/null || true' >> "$BASH_ENV"

            # Verify pnpm works
            echo "Verifying pnpm installation..."
            corepack pnpm --version

  install-dependencies:
    description: 'Install dependencies with pnpm'
    steps:
      - restore_cache:
          keys:
            - deps-v3-{{ checksum "pnpm-lock.yaml" }}
            - deps-v3-
      - run:
          name: 'Install dependencies'
          command: |
            # Ensure optional native bindings are installed on CI.
            export NPM_CONFIG_OPTIONAL=true
            export PNPM_CONFIG_OPTIONAL=true
            pnpm install --frozen-lockfile
      - save_cache:
          key: deps-v3-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - node_modules
            - ~/.pnpm-store

  setup-aws:
    description: 'Setup AWS CLI'
    steps:
      - run:
          name: 'Install AWS CLI'
          command: |
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip awscliv2.zip
            sudo ./aws/install
            aws --version

  get-terraform-outputs:
    description: 'Get Terraform outputs for environment'
    parameters:
      environment:
        type: string
        description: 'Environment name (development, prod)'
      apply_if_missing:
        type: boolean
        description: 'Apply infrastructure if outputs are missing'
        default: true
    steps:
      - run:
          name: 'Get Terraform outputs for << parameters.environment >>'
          command: |
            # Ensure AWS region is set for Terraform/AWS SDK
            export AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-eu-central-1}"
            export AWS_REGION="${AWS_REGION:-$AWS_DEFAULT_REGION}"

            # Disable colored output to prevent ANSI codes in variables
            export NO_COLOR=1
            export TF_CLI_ARGS="-no-color"

            # Map environment to directory name
            ENV_DIR="<< parameters.environment >>"

            cd infrastructure/environments/${ENV_DIR}

            # Create Terraform state backend resources if they don't exist
            if [ "${ENV_DIR}" = "development" ]; then
              STATE_BUCKET="riddle-rush-terraform-state-dev"
              LOCK_TABLE="terraform-state-lock-dev"
            elif [ "${ENV_DIR}" = "prod" ]; then
              STATE_BUCKET="riddle-rush-terraform-state-prod"
              LOCK_TABLE="terraform-state-lock-prod"
            fi

            # Create S3 bucket for state
            if ! aws s3 ls "s3://${STATE_BUCKET}" 2>/dev/null; then
              echo "Creating S3 state bucket: ${STATE_BUCKET}"
              aws s3 mb "s3://${STATE_BUCKET}" --region eu-central-1
              aws s3api put-bucket-versioning --bucket "${STATE_BUCKET}" --versioning-configuration Status=Enabled
              aws s3api put-bucket-encryption --bucket "${STATE_BUCKET}" --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
              aws s3api put-public-access-block --bucket "${STATE_BUCKET}" --public-access-block-configuration "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
            fi

            # Create DynamoDB table for state locking
            if ! aws dynamodb describe-table --table-name "${LOCK_TABLE}" 2>/dev/null; then
              echo "Creating DynamoDB lock table: ${LOCK_TABLE}"
              aws dynamodb create-table --table-name "${LOCK_TABLE}" --attribute-definitions AttributeName=LockID,AttributeType=S --key-schema AttributeName=LockID,KeyType=HASH --provisioned-throughput ReadCapacityUnits=1,WriteCapacityUnits=1 --region eu-central-1
            fi

            # Initialize Terraform (reconfigure to ensure backend is correct)
            echo "Initializing Terraform..."
            terraform init -no-color -input=false -reconfigure

            # Get and validate Terraform outputs (strip any whitespace/newlines)
            echo "Fetching Terraform outputs..."
            AWS_S3_BUCKET=$(terraform output -raw -no-color bucket_name 2>/dev/null | tr -d '\n\r' || echo "")
            AWS_CLOUDFRONT_ID=$(terraform output -raw -no-color cloudfront_distribution_id 2>/dev/null | tr -d '\n\r' || echo "")
            AWS_CLOUDFRONT_DOMAIN=$(terraform output -raw -no-color cloudfront_domain_name 2>/dev/null | tr -d '\n\r' || echo "")
            AWS_REGION=$(terraform output -raw -no-color aws_region 2>/dev/null | tr -d '\n\r' || echo "")

            if [ -z "$AWS_S3_BUCKET" ] || [ -z "$AWS_CLOUDFRONT_ID" ] || [ -z "$AWS_CLOUDFRONT_DOMAIN" ] || [ -z "$AWS_REGION" ]; then
              if [ "<< parameters.apply_if_missing >>" = "true" ]; then
                echo "Terraform outputs missing; applying infrastructure..."
                terraform plan -no-color -out=tfplan
                terraform apply -no-color -auto-approve tfplan

                AWS_S3_BUCKET=$(terraform output -raw -no-color bucket_name 2>/dev/null | tr -d '\n\r' || echo "")
                AWS_CLOUDFRONT_ID=$(terraform output -raw -no-color cloudfront_distribution_id 2>/dev/null | tr -d '\n\r' || echo "")
                AWS_CLOUDFRONT_DOMAIN=$(terraform output -raw -no-color cloudfront_domain_name 2>/dev/null | tr -d '\n\r' || echo "")
                AWS_REGION=$(terraform output -raw -no-color aws_region 2>/dev/null | tr -d '\n\r' || echo "")
              fi
            fi

            # Validate required outputs
            if [ -z "$AWS_S3_BUCKET" ]; then
              echo "ERROR: Failed to get S3 bucket name from Terraform outputs"
              exit 1
            fi

            if [ -z "$AWS_CLOUDFRONT_ID" ]; then
              echo "ERROR: Failed to get CloudFront distribution ID from Terraform outputs"
              exit 1
            fi

            if [ -z "$AWS_CLOUDFRONT_DOMAIN" ]; then
              echo "ERROR: Failed to get CloudFront domain name from Terraform outputs"
              exit 1
            fi

            if [ -z "$AWS_REGION" ]; then
              echo "ERROR: Failed to get AWS region from Terraform outputs"
              exit 1
            fi

            # Export validated outputs (ensure clean values)
            echo "export AWS_S3_BUCKET='${AWS_S3_BUCKET}'" >> "$BASH_ENV"
            echo "export AWS_CLOUDFRONT_ID='${AWS_CLOUDFRONT_ID}'" >> "$BASH_ENV"
            echo "export AWS_CLOUDFRONT_DOMAIN='${AWS_CLOUDFRONT_DOMAIN}'" >> "$BASH_ENV"
            echo "export AWS_REGION='${AWS_REGION}'" >> "$BASH_ENV"

            echo "✅ Terraform outputs validated:"
            echo "  S3 Bucket: $AWS_S3_BUCKET"
            echo "  CloudFront ID: $AWS_CLOUDFRONT_ID"
            echo "  CloudFront Domain: $AWS_CLOUDFRONT_DOMAIN"
            echo "  AWS Region: $AWS_REGION"

            cd ../../..

# Jobs
jobs:
  test:
    description: 'Run unit tests for game app'
    docker:
      - image: *custom-image
        auth:
          username: $GITLAB_REGISTRY_USER
          password: $GITLAB_REGISTRY_TOKEN
    steps:
      - checkout
      - install-dependencies
      - run:
          name: 'Run unit tests'
          command: |
            chmod +x scripts/ci-test.sh
            ./scripts/ci-test.sh
      - store_test_results:
          path: apps/game/coverage
          when: always
      - store_artifacts:
          path: apps/game/coverage
          when: always

  build:
    description: 'Build game app for production'
    docker:
      - image: *custom-image
        auth:
          username: $GITLAB_REGISTRY_USER
          password: $GITLAB_REGISTRY_TOKEN
    steps:
      - checkout
      - install-dependencies
      - run:
          name: 'Build game app'
          command: |
            chmod +x scripts/ci-build.sh
            ./scripts/ci-build.sh
      - persist_to_workspace:
          root: .
          paths:
            - apps/game/.output
      - store_artifacts:
          path: apps/game/.output
          when: always

  build-docs:
    description: 'Build documentation site'
    docker:
      - image: *custom-image
        auth:
          username: $GITLAB_REGISTRY_USER
          password: $GITLAB_REGISTRY_TOKEN
    steps:
      - checkout
      - install-dependencies
      - run:
          name: 'Build documentation site'
          command: |
            cd apps/docs
            pnpm run generate
            cd ../..
            mkdir -p public
            if [ -d "apps/docs/.output/public" ]; then
              cp -r apps/docs/.output/public/* public/
              echo "✅ Copied docs output to public/"
            else
              echo "❌ Error: apps/docs/.output/public not found"
              exit 1
            fi
      - store_artifacts:
          path: public
          when: always

  deploy-aws-dev:
    description: 'Deploy to AWS development environment'
    docker:
      - image: *custom-image
        auth:
          username: $GITLAB_REGISTRY_USER
          password: $GITLAB_REGISTRY_TOKEN
    steps:
      - checkout
      - attach_workspace:
          at: .
      - install-dependencies
      # AWS CLI and Terraform are pre-installed in custom image
      - run:
          name: 'Verify AWS credentials'
          command: |
            aws sts get-caller-identity
      - run:
          name: 'Terraform plan & apply (development)'
          command: |
            export AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-eu-central-1}"
            export AWS_REGION="${AWS_REGION:-$AWS_DEFAULT_REGION}"
            export NO_COLOR=1
            export TF_CLI_ARGS="-no-color"

            cd infrastructure/environments/development
            terraform init -no-color -input=false -reconfigure
            if ! terraform state list | grep -q "module.website.aws_cloudfront_origin_access_control.website"; then
              oac_id="$(aws cloudfront list-origin-access-controls --query "OriginAccessControlList.Items[?Name=='riddle-rush-pwa-oac-development'].Id | [0]" --output text)"
              if [ -n "$oac_id" ] && [ "$oac_id" != "None" ]; then
                terraform import module.website.aws_cloudfront_origin_access_control.website "$oac_id"
              fi
            fi
            terraform plan -no-color -out=tfplan
            terraform apply -no-color -auto-approve tfplan
            cd ../../..
      - get-terraform-outputs:
          environment: development
          apply_if_missing: false
      - run:
          name: 'Deploy to AWS development and verify'
          command: |
            export CI=true
            export AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-eu-central-1}"
            export AWS_REGION="${AWS_REGION:-$AWS_DEFAULT_REGION}"
            VERIFY_ASYNC="${VERIFY_ASYNC:-false}"
            VERIFY_DELAY="${VERIFY_DELAY:-60}"
            VERIFY_TIMEOUT="${VERIFY_TIMEOUT:-600}"

            # Verify environment variables from get-terraform-outputs are set
            echo "Verifying Terraform outputs are available..."
            if [ -z "${AWS_S3_BUCKET:-}" ]; then
              echo "ERROR: AWS_S3_BUCKET not set - get-terraform-outputs may have failed"
              exit 1
            fi
            if [ -z "${AWS_CLOUDFRONT_ID:-}" ]; then
              echo "WARNING: AWS_CLOUDFRONT_ID not set - cache invalidation will be skipped"
            fi
            echo "Using Terraform outputs from apply stage:"
            echo "  S3 Bucket: ${AWS_S3_BUCKET}"
            echo "  CloudFront ID: ${AWS_CLOUDFRONT_ID:-<not set>}"
            echo "  CloudFront Domain: ${AWS_CLOUDFRONT_DOMAIN:-${AWS_CLOUDFRONT_DOMAIN_DEV:-<not set>}}"

            chmod +x aws-deploy.sh
            ./aws-deploy.sh development

            verify_cloudfront() {
              # Use environment-specific CloudFront domain variable
              CLOUDFRONT_DOMAIN="${AWS_CLOUDFRONT_DOMAIN_DEV:-${AWS_CLOUDFRONT_DOMAIN:-}}"
              if [ -z "$CLOUDFRONT_DOMAIN" ]; then
                echo "ERROR: Missing CloudFront domain for verification"
                echo "  Expected: AWS_CLOUDFRONT_DOMAIN_DEV or AWS_CLOUDFRONT_DOMAIN"
                return 1
              fi

              export BASE_URL="https://${CLOUDFRONT_DOMAIN}"
              echo "Verifying development deployment at: $BASE_URL"
              echo "Waiting ${VERIFY_DELAY} seconds for CloudFront invalidation to propagate..."
              sleep "${VERIFY_DELAY}"

              echo "Checking HTML response from CloudFront..."
              http_code="$(curl -sS -L -o /tmp/cloudfront-response.html -w "%{http_code}" "$BASE_URL" || true)"
              if [ -z "$http_code" ] || [ "$http_code" -lt 200 ] || [ "$http_code" -ge 400 ]; then
                echo "ERROR: CloudFront returned HTTP $http_code"
                return 1
              fi
              if ! grep -i "<html" /tmp/cloudfront-response.html >/dev/null 2>&1; then
                echo "ERROR: CloudFront response did not include HTML"
                return 1
              fi
              echo "✅ CloudFront returned HTML (HTTP $http_code)"
            }

            export -f verify_cloudfront

            if [ "$VERIFY_ASYNC" = "true" ]; then
              echo "Running verification asynchronously (timeout ${VERIFY_TIMEOUT}s)"
              timeout "${VERIFY_TIMEOUT}" bash -c verify_cloudfront || echo "⚠️  Verification failed or timed out (non-blocking)"
            else
              echo "Running verification synchronously (timeout ${VERIFY_TIMEOUT}s)"
              timeout "${VERIFY_TIMEOUT}" bash -c verify_cloudfront
            fi
      - store_artifacts:
          path: deployment-info.json
          when: always

  deploy-aws-prod:
    description: 'Deploy to AWS production environment'
    docker:
      - image: *custom-image
        auth:
          username: $GITLAB_REGISTRY_USER
          password: $GITLAB_REGISTRY_TOKEN
    steps:
      - checkout
      - attach_workspace:
          at: .
      - install-dependencies
      # AWS CLI and Terraform are pre-installed in custom image
      - run:
          name: 'Verify AWS credentials'
          command: |
            aws sts get-caller-identity
      - run:
          name: 'Terraform plan & apply (production)'
          command: |
            export AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-eu-central-1}"
            export AWS_REGION="${AWS_REGION:-$AWS_DEFAULT_REGION}"
            export NO_COLOR=1
            export TF_CLI_ARGS="-no-color"

            cd infrastructure/environments/prod
            terraform init -no-color -input=false -reconfigure
            if ! terraform state list | grep -q "module.website.aws_cloudfront_origin_access_control.website"; then
              oac_id="$(aws cloudfront list-origin-access-controls --query "OriginAccessControlList.Items[?Name=='riddle-rush-pwa-oac-production'].Id | [0]" --output text)"
              if [ -n "$oac_id" ] && [ "$oac_id" != "None" ]; then
                terraform import module.website.aws_cloudfront_origin_access_control.website "$oac_id"
              fi
            fi
            terraform plan -no-color -out=tfplan
            terraform apply -no-color -auto-approve tfplan
            cd ../../..
      - get-terraform-outputs:
          environment: prod
          apply_if_missing: false
      - run:
          name: 'Deploy to AWS production and verify'
          command: |
            export CI=true
            export AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-eu-central-1}"
            export AWS_REGION="${AWS_REGION:-$AWS_DEFAULT_REGION}"
            VERIFY_ASYNC="${VERIFY_ASYNC:-false}"
            VERIFY_DELAY="${VERIFY_DELAY:-60}"
            VERIFY_TIMEOUT="${VERIFY_TIMEOUT:-600}"

            # Verify environment variables from get-terraform-outputs are set
            echo "Verifying Terraform outputs are available..."
            if [ -z "${AWS_S3_BUCKET:-}" ]; then
              echo "ERROR: AWS_S3_BUCKET not set - get-terraform-outputs may have failed"
              exit 1
            fi
            if [ -z "${AWS_CLOUDFRONT_ID:-}" ]; then
              echo "WARNING: AWS_CLOUDFRONT_ID not set - cache invalidation will be skipped"
            fi
            echo "Using Terraform outputs from apply stage:"
            echo "  S3 Bucket: ${AWS_S3_BUCKET}"
            echo "  CloudFront ID: ${AWS_CLOUDFRONT_ID:-<not set>}"
            echo "  CloudFront Domain: ${AWS_CLOUDFRONT_DOMAIN:-<not set>}"

            chmod +x aws-deploy.sh
            ./aws-deploy.sh production

            verify_cloudfront() {
              if [ -z "${AWS_CLOUDFRONT_DOMAIN:-}" ]; then
                echo "ERROR: Missing AWS_CLOUDFRONT_DOMAIN for verification"
                return 1
              fi

              export BASE_URL="https://${AWS_CLOUDFRONT_DOMAIN}"
              echo "Verifying production deployment at: $BASE_URL"
              echo "Waiting ${VERIFY_DELAY} seconds for CloudFront invalidation to propagate..."
              sleep "${VERIFY_DELAY}"

              echo "Checking HTML response from CloudFront..."
              http_code="$(curl -sS -L -o /tmp/cloudfront-response.html -w "%{http_code}" "$BASE_URL" || true)"
              if [ -z "$http_code" ] || [ "$http_code" -lt 200 ] || [ "$http_code" -ge 400 ]; then
                echo "ERROR: CloudFront returned HTTP $http_code"
                return 1
              fi
              if ! grep -i "<html" /tmp/cloudfront-response.html >/dev/null 2>&1; then
                echo "ERROR: CloudFront response did not include HTML"
                return 1
              fi
              echo "✅ CloudFront returned HTML (HTTP $http_code)"
            }

            export -f verify_cloudfront

            if [ "$VERIFY_ASYNC" = "true" ]; then
              echo "Running verification asynchronously (timeout ${VERIFY_TIMEOUT}s)"
              timeout "${VERIFY_TIMEOUT}" bash -c verify_cloudfront || echo "⚠️  Verification failed or timed out (non-blocking)"
            else
              echo "Running verification synchronously (timeout ${VERIFY_TIMEOUT}s)"
              timeout "${VERIFY_TIMEOUT}" bash -c verify_cloudfront
            fi
      - store_artifacts:
          path: deployment-info.json
          when: always

# Workflows
workflows:
  version: 2

  # Development deployment workflow
  deploy-dev:
    jobs:
      - test:
          filters:
            branches:
              only: /^development$/
      - build:
          requires:
            - test
          filters:
            branches:
              only: /^development$/
      # Deployment (can be set to manual approval in CircleCI UI)
      - deploy-aws-dev:
          context: deploy-aws-dev
          requires:
            - build
          filters:
            branches:
              only: /^development$/

  # Production deployment workflow
  deploy-prod:
    jobs:
      - test:
          filters:
            branches:
              only: /^main$/
            tags:
              only: /^v.*/
      - build:
          requires:
            - test
          filters:
            branches:
              only: /^main$/
            tags:
              only: /^v.*/
      - build-docs:
          requires:
            - build
          filters:
            branches:
              only: /^main$/
      # Production deployment (should require manual approval in CircleCI UI)
      - deploy-aws-prod:
          requires:
            - build
          filters:
            branches:
              only: /^main$/
            tags:
              only: /^v.*/
