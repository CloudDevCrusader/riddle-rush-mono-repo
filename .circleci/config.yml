version: 2.1

executors:
  node20:
    docker:
      - image: cimg/node:20.11.1
    working_directory: ~/project

commands:
  setup_pnpm:
    steps:
      - run:
          name: Enable pnpm via Corepack
          command: |
            corepack enable
            corepack prepare pnpm@10.28.2 --activate
            pnpm --version

jobs:
  workspace_check:
    executor: node20
    steps:
      - checkout
      - setup_pnpm
      - restore_cache:
          keys:
            - pnpm-store-v1-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-store-v1-
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - save_cache:
          key: pnpm-store-v1-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.local/share/pnpm/store
      - run:
          name: Workspace checks
          command: pnpm run workspace:check
      - run:
          name: Unit tests
          command: pnpm run test:unit

workflows:
  version: 2
  ci:
    jobs:
      - workspace_check
