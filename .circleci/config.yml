version: 2.1

# CircleCI configuration for Riddle Rush Nuxt PWA monorepo
# Mirrors GitLab CI pipeline structure with CircleCI-specific optimizations
#
# Custom Docker Image:
# This configuration uses a custom Docker image with pre-installed tools (AWS CLI, Terraform, pnpm)
# to speed up build times. Build and push your own image using:
#   cd .circleci && ./build-docker-image.sh --push
# The image will be pushed to GitLab Container Registry.

# Custom image with pre-installed tools (Node.js 20.19.0, pnpm, AWS CLI, Terraform)
# See .circleci/Dockerfile for details
# TODO: Replace with your GitLab project path after building and pushing the image
x-custom-image: &custom-image registry.gitlab.com/djdiox/riddle-rush-nuxt-pwa/ci-build:latest

# Reusable commands
commands:
  setup-pnpm:
    description: 'Setup pnpm via corepack'
    steps:
      - run:
          name: 'Prepare pnpm with corepack'
          command: |
            # Setup user directories for corepack cache
            export COREPACK_HOME="$HOME/.corepack"
            export PNPM_HOME="$HOME/.local/share/pnpm"
            export PATH="$PNPM_HOME:$COREPACK_HOME/bin:$PATH"
            mkdir -p "$COREPACK_HOME" "$PNPM_HOME"

            # Get pnpm version from package.json
            PNPM_VERSION=$(grep -oE '"packageManager"\s*:\s*"pnpm@[^"]*"' package.json | grep -oE 'pnpm@[^"]*' | cut -d'@' -f2 || echo "10.27.0")
            echo "Using pnpm version: ${PNPM_VERSION}"

            # Prepare pnpm (downloads to user cache, no system-wide installation)
            corepack prepare "pnpm@${PNPM_VERSION}" --activate

            # Create pnpm wrapper that always uses corepack (avoids permission issues)
            echo 'pnpm() { corepack pnpm "$@"; }' >> "$BASH_ENV"
            echo 'export -f pnpm 2>/dev/null || true' >> "$BASH_ENV"

            # Verify pnpm works
            echo "Verifying pnpm installation..."
            corepack pnpm --version

  install-dependencies:
    description: 'Install dependencies with pnpm'
    steps:
      - restore_cache:
          keys:
            - deps-v3-{{ checksum "pnpm-lock.yaml" }}
            - deps-v3-
      - run:
          name: 'Install dependencies'
          command: |
            # Ensure optional native bindings are installed on CI.
            export NPM_CONFIG_OPTIONAL=true
            export PNPM_CONFIG_OPTIONAL=true
            pnpm install --frozen-lockfile
      - save_cache:
          key: deps-v3-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - node_modules
            - ~/.pnpm-store

  setup-aws:
    description: 'Setup AWS CLI'
    steps:
      - run:
          name: 'Install AWS CLI'
          command: |
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip awscliv2.zip
            sudo ./aws/install
            aws --version

  setup-terraform:
    description: 'Install Terraform'
    steps:
      - run:
          name: 'Install Terraform'
          command: |
            wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
            echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
            sudo apt-get update && sudo apt-get install -y terraform
            terraform version

  get-terraform-outputs:
    description: 'Get Terraform outputs for environment'
    parameters:
      environment:
        type: string
        description: 'Environment name (development, prod)'
    steps:
      - run:
          name: 'Get Terraform outputs for << parameters.environment >>'
          command: |
            # Ensure AWS region is set for Terraform/AWS SDK
            export AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-eu-central-1}"
            export AWS_REGION="${AWS_REGION:-$AWS_DEFAULT_REGION}"

            # Disable colored output to prevent ANSI codes in variables
            export NO_COLOR=1
            export TF_CLI_ARGS="-no-color"

            # Map environment to directory name
            ENV_DIR="<< parameters.environment >>"

            cd infrastructure/environments/${ENV_DIR}

            # Initialize Terraform if needed
            if [ ! -d ".terraform" ]; then
              echo "Initializing Terraform..."
              terraform init -backend=false -no-color || terraform init -no-color
            fi

            # Get and validate Terraform outputs (strip any whitespace/newlines)
            echo "Fetching Terraform outputs..."
            AWS_S3_BUCKET=$(terraform output -raw -no-color bucket_name 2>/dev/null | tr -d '\n\r' || echo "")
            AWS_CLOUDFRONT_ID=$(terraform output -raw -no-color cloudfront_distribution_id 2>/dev/null | tr -d '\n\r' || echo "")
            AWS_CLOUDFRONT_DOMAIN=$(terraform output -raw -no-color cloudfront_domain_name 2>/dev/null | tr -d '\n\r' || echo "")
            AWS_REGION=$(terraform output -raw -no-color aws_region 2>/dev/null | tr -d '\n\r' || echo "")

            # Validate required outputs
            if [ -z "$AWS_S3_BUCKET" ]; then
              echo "ERROR: Failed to get S3 bucket name from Terraform outputs"
              exit 1
            fi

            if [ -z "$AWS_CLOUDFRONT_ID" ]; then
              echo "ERROR: Failed to get CloudFront distribution ID from Terraform outputs"
              exit 1
            fi

            if [ -z "$AWS_CLOUDFRONT_DOMAIN" ]; then
              echo "ERROR: Failed to get CloudFront domain name from Terraform outputs"
              exit 1
            fi

            if [ -z "$AWS_REGION" ]; then
              echo "ERROR: Failed to get AWS region from Terraform outputs"
              exit 1
            fi

            # Export validated outputs (ensure clean values)
            echo "export AWS_S3_BUCKET='${AWS_S3_BUCKET}'" >> "$BASH_ENV"
            echo "export AWS_CLOUDFRONT_ID='${AWS_CLOUDFRONT_ID}'" >> "$BASH_ENV"
            echo "export AWS_CLOUDFRONT_DOMAIN='${AWS_CLOUDFRONT_DOMAIN}'" >> "$BASH_ENV"
            echo "export AWS_REGION='${AWS_REGION}'" >> "$BASH_ENV"

            echo "✅ Terraform outputs validated:"
            echo "  S3 Bucket: $AWS_S3_BUCKET"
            echo "  CloudFront ID: $AWS_CLOUDFRONT_ID"
            echo "  CloudFront Domain: $AWS_CLOUDFRONT_DOMAIN"
            echo "  AWS Region: $AWS_REGION"

            cd ../../..

# Jobs
jobs:
  test:
    description: 'Run unit tests for game app'
    docker:
      - image: *custom-image
        auth:
          username: $GITLAB_REGISTRY_USER
          password: $GITLAB_REGISTRY_TOKEN
    steps:
      - checkout
      - setup-pnpm
      - install-dependencies
      - run:
          name: 'Run unit tests'
          command: |
            chmod +x scripts/ci-test.sh
            ./scripts/ci-test.sh
      - store_test_results:
          path: apps/game/coverage
          when: always
      - store_artifacts:
          path: apps/game/coverage
          when: always

  sonarcloud-check:
    description: 'Run SonarCloud code quality analysis'
    docker:
      - image: sonarsource/sonar-scanner-cli:latest
    steps:
      - checkout
      - restore_cache:
          keys:
            - sonar-cache-{{ checksum "sonar-project.properties" }}
            - sonar-cache-
      - run:
          name: 'Run SonarCloud analysis'
          command: |
            # CircleCI project-level environment variables are automatically available
            echo "Running SonarCloud analysis..."
            echo "Project: $SONAR_PROJECT_KEY"
            echo "Organization: $SONAR_ORGANIZATION"

            # Verify variables are set
            if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_PROJECT_KEY" ] || [ -z "$SONAR_ORGANIZATION" ]; then
              echo "ERROR: SonarCloud environment variables not set in CircleCI!"
              echo "Please configure in: Project Settings > Environment Variables"
              echo "Required: SONAR_TOKEN, SONAR_PROJECT_KEY, SONAR_ORGANIZATION"
              exit 1
            fi

            sonar-scanner \
              -Dsonar.token="$SONAR_TOKEN" \
              -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
              -Dsonar.organization="$SONAR_ORGANIZATION"
      - save_cache:
          key: sonar-cache-{{ checksum "sonar-project.properties" }}
          paths:
            - .sonar/cache

  build:
    description: 'Build game app for production'
    docker:
      - image: *custom-image
        auth:
          username: $GITLAB_REGISTRY_USER
          password: $GITLAB_REGISTRY_TOKEN
    steps:
      - checkout
      - setup-pnpm
      - install-dependencies
      - run:
          name: 'Build game app'
          command: |
            chmod +x scripts/ci-build.sh
            ./scripts/ci-build.sh
      - store_artifacts:
          path: apps/game/.output
          when: always

  build-docs:
    description: 'Build documentation site'
    docker:
      - image: *custom-image
        auth:
          username: $GITLAB_REGISTRY_USER
          password: $GITLAB_REGISTRY_TOKEN
    steps:
      - checkout
      - setup-pnpm
      - install-dependencies
      - run:
          name: 'Build documentation site'
          command: |
            cd apps/docs
            pnpm run generate
            cd ../..
            mkdir -p public
            if [ -d "apps/docs/.output/public" ]; then
              cp -r apps/docs/.output/public/* public/
              echo "✅ Copied docs output to public/"
            else
              echo "❌ Error: apps/docs/.output/public not found"
              exit 1
            fi
      - store_artifacts:
          path: public
          when: always

  deploy-aws-dev:
    description: 'Deploy to AWS development environment'
    docker:
      - image: *custom-image
        auth:
          username: $GITLAB_REGISTRY_USER
          password: $GITLAB_REGISTRY_TOKEN
    steps:
      - checkout
      - setup-pnpm
      - install-dependencies
      # AWS CLI and Terraform are pre-installed in custom image
      - run:
          name: 'Verify AWS credentials'
          command: |
            aws sts get-caller-identity
      - get-terraform-outputs:
          environment: development
      - run:
          name: 'Deploy to AWS development'
          command: |
            chmod +x aws-deploy.sh
            ./aws-deploy.sh development
      - store_artifacts:
          path: deployment-info.json
          when: always

  deploy-aws-prod:
    description: 'Deploy to AWS production environment'
    docker:
      - image: *custom-image
        auth:
          username: $GITLAB_REGISTRY_USER
          password: $GITLAB_REGISTRY_TOKEN
    steps:
      - checkout
      - setup-pnpm
      - install-dependencies
      # AWS CLI and Terraform are pre-installed in custom image
      - run:
          name: 'Verify AWS credentials'
          command: |
            aws sts get-caller-identity
      - get-terraform-outputs:
          environment: prod
      - run:
          name: 'Deploy to AWS production'
          command: |
            chmod +x aws-deploy.sh
            ./aws-deploy.sh production
      - store_artifacts:
          path: deployment-info.json
          when: always

  test-e2e-local:
    description: 'Run E2E tests against local build'
    docker:
      - image: mcr.microsoft.com/playwright:v1.57.0-noble
    steps:
      - checkout
      - setup-pnpm
      - install-dependencies
      - run:
          name: 'Run E2E tests (local build)'
          command: |
            chmod +x scripts/ci-e2e.sh
            ./scripts/ci-e2e.sh
      - store_test_results:
          path: test-results
          when: always
      - store_artifacts:
          path: playwright-report
          when: always
      - store_artifacts:
          path: test-results
          when: always

  verify-e2e-aws:
    description: 'Verify AWS deployment with E2E tests'
    parameters:
      environment:
        type: string
        description: 'Environment name (development, prod)'
      wait_time:
        type: integer
        description: 'Wait time in seconds for CloudFront propagation'
        default: 60
    docker:
      - image: mcr.microsoft.com/playwright:v1.57.0-noble
    steps:
      - checkout
      - setup-pnpm
      - install-dependencies
      - setup-terraform
      - run:
          name: 'Get CloudFront domain and run E2E tests'
          command: |
            # Ensure AWS region is set for Terraform/AWS SDK
            export AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-eu-central-1}"
            export AWS_REGION="${AWS_REGION:-$AWS_DEFAULT_REGION}"

            cd infrastructure/environments/<< parameters.environment >>

            # Initialize Terraform if needed
            if [ ! -d ".terraform" ]; then
              echo "Initializing Terraform..."
              terraform init -backend=false || terraform init
            fi

            AWS_CLOUDFRONT_DOMAIN=$(terraform output -raw cloudfront_domain_name 2>/dev/null || echo "")

            if [ -z "$AWS_CLOUDFRONT_DOMAIN" ]; then
              echo "ERROR: Failed to get CloudFront domain name from Terraform outputs"
              exit 1
            fi

            export BASE_URL=https://$AWS_CLOUDFRONT_DOMAIN
            export CRITICAL_TESTS_ONLY=true
            echo "✅ Using CloudFront domain from Terraform: $AWS_CLOUDFRONT_DOMAIN"
            echo "⚠️  Running CRITICAL tests only (@critical tag)"

            cd ../../..

            echo "Testing AWS << parameters.environment >> deployment at: $BASE_URL"
            echo "Waiting << parameters.wait_time >> seconds for CloudFront invalidation to propagate..."
            sleep << parameters.wait_time >>

            chmod +x scripts/ci-e2e.sh
            ./scripts/ci-e2e.sh
      - store_test_results:
          path: test-results
          when: always
      - store_artifacts:
          path: playwright-report
          when: always
      - store_artifacts:
          path: test-results
          when: always

# Workflows
workflows:
  version: 2

  # Main workflow - runs on all branches and PRs
  test-and-build:
    jobs:
      # Run tests on all branches and tags
      - test
      # SonarCloud analysis on main branches
      - sonarcloud-check:
          filters:
            branches:
              only: /^(main|development|staging)$/
      # Build after tests pass
      - build:
          requires:
            - test
          filters:
            branches:
              only: /^(main|development|staging)$/
            tags:
              only: /^v.*/
      # Build docs on main branch
      - build-docs:
          filters:
            branches:
              only: /^main$/
      # E2E tests (can be triggered manually via CircleCI UI)
      - test-e2e-local:
          requires:
            - build
          filters:
            branches:
              only: /^(main|development|staging)$/
            # Note: Can be set to manual in CircleCI UI project settings

  # Development deployment workflow
  deploy-dev:
    jobs:
      - test:
          filters:
            branches:
              only: /^development$/
      - build:
          requires:
            - test
          filters:
            branches:
              only: /^development$/
      # Deployment (can be set to manual approval in CircleCI UI)
      - deploy-aws-dev:
          context: deploy-aws-dev
          requires:
            - build
          filters:
            branches:
              only: /^development$/
      # Verification (can be set to manual approval in CircleCI UI)
      - verify-e2e-aws:
          name: verify-e2e-aws-dev
          environment: development
          requires:
            - deploy-aws-dev
          filters:
            branches:
              only: /^development$/

  # Production deployment workflow
  deploy-prod:
    jobs:
      - test:
          filters:
            branches:
              only: /^main$/
            tags:
              only: /^v.*/
      - build:
          requires:
            - test
          filters:
            branches:
              only: /^main$/
            tags:
              only: /^v.*/
      # Production deployment (should require manual approval in CircleCI UI)
      - deploy-aws-prod:
          requires:
            - build
          filters:
            branches:
              only: /^main$/
            tags:
              only: /^v.*/
      # Production verification (should require manual approval in CircleCI UI)
      - verify-e2e-aws:
          name: verify-e2e-aws-prod
          environment: prod
          requires:
            - deploy-aws-prod
          filters:
            branches:
              only: /^main$/
            tags:
              only: /^v.*/
