# SonarCloud project configuration
# See https://docs.sonarcloud.io/getting-started/gitlab-integration/

sonar.projectKey=${SONAR_PROJECT_KEY}
sonar.organization=${SONAR_ORGANIZATION}

# Source code location (monorepo structure)
sonar.sources=apps,packages
sonar.exclusions=**/node_modules/**,**/.nuxt/**,**/.output/**,**/dist/**,**/coverage/**,**/playwright-report/**,**/test-results/**,**/*.min.js,**/public/**,**/docs/**,**/.git/**,**/.cursor/**,**/scripts/**

# Test files (monorepo structure - tests are in apps/game/tests)
sonar.tests=apps/game/tests
sonar.test.inclusions=**/*.spec.ts,**/*.spec.js,**/*.test.ts,**/*.test.js

# Language and encoding
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=apps/game/coverage/lcov.info
sonar.typescript.lcov.reportPaths=apps/game/coverage/lcov.info

# Coverage exclusions
sonar.coverage.exclusions=**/*.spec.ts,**/*.spec.js,**/tests/**,**/test-utils/**,**/factories.ts,**/nuxt.config.ts,**/playwright.config.ts,**/vitest.config.ts,**/eslint.config.mjs,**/i18n.config.ts

# Additional settings
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx,.vue
