# ===========================================
# Deploy Production Environment to AWS
# ===========================================
# Triggers on semver tags (e.g. v1.5.2). Uses GitHub Environment "production"
# for secrets and optional approval gates.
#
# Required secrets (repo or production environment):
#   - AWS_ACCESS_KEY_ID
#   - AWS_SECRET_ACCESS_KEY
#
# Bucket / CloudFront / region are read from infrastructure/environments/production/terraform-outputs.json in the repo.

name: Deploy Production (AWS)

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

concurrency:
  group: deploy-prod-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.33.0'

jobs:
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test:unit

  deploy:
    name: Deploy to AWS (Production)
    needs: quality-checks
    if: success()
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://riddlerush.de
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check required secrets
        id: check-secrets
        run: |
          echo "::group::🔑 Checking required secrets and variables"

          # Check AWS secrets
          if [[ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]]; then
            echo "::error::❌ AWS_ACCESS_KEY_ID secret is missing!"
            echo "🔧 Please add this secret to the repository settings or production environment."
            echo "::warning::❌ AWS_ACCESS_KEY_ID secret is missing - deployment will fail!"
          fi

          if [[ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]]; then
            echo "::error::❌ AWS_SECRET_ACCESS_KEY secret is missing!"
            echo "🔧 Please add this secret to the repository settings or production environment."
            echo "::warning::❌ AWS_SECRET_ACCESS_KEY secret is missing - deployment will fail!"
          fi

          # Check Terraform outputs
          if [[ ! -f "infrastructure/environments/production/terraform-outputs.json" ]]; then
            echo "::warning::⚠️  terraform-outputs.json not found in infrastructure/environments/production/"
            echo "   This script expects the infrastructure to be deployed first."
            echo "   Run: terraform plan && terraform apply"
          else
            # Check for required values in terraform-outputs.json
            S3_BUCKET=$(jq -r '.s3_bucket_name.value // empty' infrastructure/environments/production/terraform-outputs.json 2>/dev/null || echo "")
            CLOUDFRONT_ID=$(jq -r '.cloudfront_distribution_id.value // empty' infrastructure/environments/production/terraform-outputs.json 2>/dev/null || echo "")
            
            if [[ -z "$S3_BUCKET" ]]; then
              echo "::warning::⚠️  S3 bucket name not found in terraform-outputs.json"
              echo "   This should be managed by Terraform infrastructure."
            fi
            
            if [[ -z "$CLOUDFRONT_ID" ]]; then
              echo "::warning::⚠️  CloudFront distribution ID not found in terraform-outputs.json"
              echo "   Cache invalidation will be skipped if not available."
              echo "   This is normal if using direct S3 website hosting."
            fi
          fi

          # Check environment variables
          if [[ -z "${AWS_REGION:-}" ]]; then
            export AWS_REGION="eu-central-1"
            echo "ℹ️  Using default AWS region: $AWS_REGION"
          fi

          echo "::endgroup::"

          # Create summary
          echo "### 🔑 Secret Check Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [[ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]] || [[ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]]; then
            echo "**❌ AWS Secrets Missing**" >> "$GITHUB_STEP_SUMMARY"
            echo "Please configure AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY secrets" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**✅ AWS Credentials Present**" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ -f "infrastructure/environments/production/terraform-outputs.json" ]]; then
            echo "**✅ Infrastructure Config Found**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**⚠️ Infrastructure Config Missing**" >> "$GITHUB_STEP_SUMMARY"
            echo "Run terraform plan && terraform apply first" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy production to AWS
        env:
          NODE_ENV: production
          BASE_URL: /
          SKIP_PRE_DEPLOYMENT_CHECKS: 'true'
          CI: 'true'
        run: chmod +x ./scripts/aws-deploy.sh && ./scripts/aws-deploy.sh production

      - name: Deployment summary
        run: |
          echo "### Production deployment (AWS)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**URL:** https://riddlerush.de" >> "$GITHUB_STEP_SUMMARY"
          echo "**Ref:** ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit:** ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
