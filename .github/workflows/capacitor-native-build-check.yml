# Verifies Capacitor Android + iOS native projects still compile after game/mobile changes.
# Android: JVM unit tests + debug APK (play flavor). iOS: Swift package config tests + Debug simulator build.
name: Capacitor native build check

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'apps/game/**'
      - 'scripts/mobile-build.sh'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/capacitor-native-build-check.yml'
  push:
    branches: [main, development, staging]
    paths:
      - 'apps/mobile/**'
      - 'apps/game/**'
      - 'scripts/mobile-build.sh'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/capacitor-native-build-check.yml'

concurrency:
  group: capacitor-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.33.0'

jobs:
  android-debug-build:
    name: Android (unit tests + debug APK)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;35.0.0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate, sync, unit tests, assemble debug
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          CI: 'true'
          NODE_OPTIONS: --max-old-space-size=8192
        run: bash scripts/mobile-build.sh android debug

  ios-debug-build:
    name: iOS (Swift config tests + Debug simulator build)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate, sync, NativeConfigTests, xcodebuild Debug (simulator)
        env:
          CI: 'true'
          NODE_OPTIONS: --max-old-space-size=8192
        run: bash scripts/mobile-build.sh ios debug
