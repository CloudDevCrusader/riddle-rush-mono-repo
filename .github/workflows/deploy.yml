name: Deploy to Vercel

on:
  push:
    branches:
      - main # Production deployments only

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  # Quality checks run on all branches
  quality-checks:
    runs-on: ubuntu-latest
    name: Quality Checks

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run workspace checks
        run: pnpm run workspace:check

      - name: Run unit tests
        run: pnpm run test:unit
        continue-on-error: true # Don't block deployment on test failures for now

  # Deploy to Vercel (production only, triggered on push to main)
  deploy:
    runs-on: ubuntu-latest
    needs: quality-checks
    name: Deploy to Production

    outputs:
      url: ${{ steps.deploy.outputs.url }}

    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment Information
        run: |
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        env:
          STAGE: production
          NODE_ENV: production
        run: |
          echo "Building for STAGE=production"
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "Deployed to: $DEPLOYMENT_URL"

  # Run E2E tests against deployed production environment
  e2e-tests:
    runs-on: ubuntu-latest
    needs: deploy
    name: E2E Tests
    continue-on-error: true # Don't fail the workflow if E2E tests fail

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright
        run: pnpm exec playwright install chromium

      - name: Run E2E tests
        env:
          BASE_URL: ${{ needs.deploy.outputs.url }}
          STAGE: production
        run: |
          pnpm run test:e2e:deployed

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-production
          path: apps/game/playwright-report/
          retention-days: 7
